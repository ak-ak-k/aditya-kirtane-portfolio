<a
  class="skip-link"
  [routerLink]="[]"
  fragment="main-content"
  queryParamsHandling="preserve"
  (click)="focusMainContent()"
  >Skip to content</a
>
<app-page-transition />

@if (!introActive() && !explorerActive()) {
  <header class="shell-header">
    <app-navbar />
  </header>
  <app-cursor />
}

<main
  #mainContent
  id="main-content"
  class="shell-content"
  [class.shell-content--intro]="introActive()"
  [class.shell-content--explorer]="explorerActive()"
  [class.shell-content--home]="landingActive()"
  tabindex="-1"
>
  <router-outlet (activate)="routeActivated.set($event)" (attach)="routeActivated.set($event)" />
</main>
